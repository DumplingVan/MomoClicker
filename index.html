<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/Favicon.png">
    <script src="scripts/script.js" defer></script>
    <title>MomoClicker.io</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="icon">MomoClicker.io</div>
    <div class="wrapper">
        <div class="main">
            <div class="countbox">
                <div class="count"></div>
            </div>
            <div class="persec"></div>
            <img class="Dumplings" src="images/Dumplings.png"></img>
        </div>
        <div class="shop">
            <div class="shoptext">Shop:</div>
            <div class="boxes">
                <div class="box" id="Cursor">
                    <div class="itemname">Cursor:</div>
                    <div class="price" id="cursorprice"></div>
                </div>
                <div class="box" id="Steamer">
                    <div class="itemname">Steamer:</div>
                    <div class="price" id="steamerprice"></div>
                </div>
                <div class="box" id="Dumpling-factory">
                    <div class="itemname">Factory:</div>
                    <div class="price" id="factoryprice"></div>
                </div>
                <div class="box" id="Fried-Dumplings">
                    <div class="itemname">Fried Dumplings:</div>
                    <div class="price" id="friedprice"></div>
                </div>
                <div class="box" id="ProfessionalChef">
                    <div class="itemname">Professional Chef:</div>
                    <div class="price" id="profprice"></div>
                </div>
            </div>
            </div>
        </div>
    </div>
    <canvas id="Canvas" width="250" height="250"></canvas>
</body>

</html>
